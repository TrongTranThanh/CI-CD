name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *' # Chạy tự động mỗi 1 giờ
  workflow_dispatch: # Cho phép bấm chạy bằng tay trên giao diện GitHub

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài đặt Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Đăng nhập Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Chạy kịch bản Monitor trực tiếp từ Cloud
        run: postman collection run "59052422-9d3bc720-a10d-4a5a-bef1-b20e02a46d1f"
